services:
  # ── Backend (Web Service) ──────────────────────────────────────
  - type: web
    name: annie-backend
    runtime: node
    rootDir: annie-backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DB_URI
        sync: false          # lo ingresas manualmente en el dashboard de Render
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production

  # ── Frontend (Static Site) ─────────────────────────────────────
  - type: web
    name: annie-frontend
    runtime: static
    rootDir: annie-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false          # pondrás la URL del backend de Render aquí
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
