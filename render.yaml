# Despliegue del BACKEND en Render.
# El frontend NO va aquí: vive en Vercel (ver annie-frontend/vercel.json).
services:
  # ── Backend (Web Service) ──────────────────────────────────────
  - type: web
    name: annie-backend
    runtime: node
    rootDir: annie-backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      # Cadena de conexión de MongoDB Atlas. Se ingresa manualmente en el
      # dashboard de Render (Environment) para no exponer la contraseña aquí.
      - key: DB_URI
        sync: false
      # Clave para firmar los tokens de sesión (JWT). También manual.
      - key: JWT_SECRET
        sync: false
      # Origen del frontend en Vercel, ej. https://annie-frontend.vercel.app
      # Los dominios *.vercel.app ya se permiten automáticamente en server.js,
      # pero si usas un dominio propio agrégalo aquí (separado por comas).
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
