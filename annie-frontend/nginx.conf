server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta desconocida sirve index.html (React Router)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache largo para assets con hash
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
