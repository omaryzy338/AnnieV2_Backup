  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Todas las rutas deben ser absolutas (con / al inicio). Si son relativas,
       al recargar en una ruta anidada como /dashboard/productos el navegador
       las busca en /dashboard/css/... , recibe el index.html del fallback SPA
       e intenta interpretarlo como CSS/JS ("Unexpected token '<'"). -->
  <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <link
    rel="apple-touch-icon"
    sizes="72x72"
    href="/img/apple-touch-icon-72x72.png"
  />
  <link
    rel="apple-touch-icon"
    sizes="114x114"
    href="/img/apple-touch-icon-114x114.png"
  />

  <link rel="stylesheet" type="text/css" href="/css/bootstrap.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" type="text/css" href="/css/style.css" />
  <link
    rel="stylesheet"
    type="text/css"
    href="/css/nivo-lightbox/nivo-lightbox.css"
  />
  <link rel="stylesheet" type="text/css" href="/css/nivo-lightbox/default.css" />
  <link
    href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css?family=Lato:400,700"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css?family=Raleway:300,400,500,600,700,800,900"

  />
